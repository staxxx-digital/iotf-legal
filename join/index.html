<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Join a trip on iOTF</title>
  <meta name="description" content="Join your crew on iOTF — From group chat to getaway.">
  <meta name="theme-color" content="#0b0b0b">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#090a09;color:#f6f6f3;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#121512;border:1px solid #252a25;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.38)}
    .brand{display:flex;align-items:center;gap:10px;color:#cfff24;font-weight:800;letter-spacing:.06em}
    .dot{width:12px;height:12px;border:2px solid #cfff24;border-radius:50%;box-shadow:0 0 16px #cfff24}
    h1{font-size:2rem;line-height:1.08;margin:22px 0 10px}
    p{color:#c3c8c3;margin:0 0 20px}
    .status{background:#0d100d;border:1px solid #2a302a;border-radius:14px;padding:14px;margin:18px 0;color:#e7e9e7;word-break:break-word}
    .actions{display:grid;gap:12px}
    button,a.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}
    .primary{background:#cfff24;color:#0b0b0b}
    .secondary{background:#232723;color:#fff;border:1px solid #353a35}
    .muted{font-size:.9rem;color:#8f968f;margin-top:18px}
    code{color:#d7ddd7}
  </style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span> iOTF</div>
  <h1>You’re invited.</h1>
  <p>From group chat to getaway. Open iOTF to join the trip.</p>
  <div class="status" id="status">Checking your invite…</div>
  <div class="actions">
    <button class="primary" id="openApp">OPEN iOTF</button>
    <button class="secondary" id="copyCode" type="button">COPY INVITE CODE</button>
  </div>
  <p class="muted">If iOTF isn’t installed yet, install the beta build from your trip host, then come back and tap <strong>OPEN iOTF</strong>.</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const token = (params.get('inviteToken') || '').trim();
  const status = document.getElementById('status');
  const open = document.getElementById('openApp');
  const copy = document.getElementById('copyCode');

  if (!token) {
    status.textContent = 'This invite link is missing its invite code.';
    open.disabled = true;
    copy.disabled = true;
    return;
  }

  status.textContent = 'Invite ready.';
  const deepLink = 'iotfvegas://iotfvegas.com/joinTrip?inviteToken=' + encodeURIComponent(token);

  open.addEventListener('click', () => {
    window.location.href = deepLink;
  });

  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(token);
      copy.textContent = 'COPIED';
      setTimeout(() => copy.textContent = 'COPY INVITE CODE', 1400);
    } catch (_) {
      window.prompt('Copy this invite code:', token);
    }
  });
})();
</script>
</body>
</html>
